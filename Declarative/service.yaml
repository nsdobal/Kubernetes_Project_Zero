apiVersion: v1
kind: Service
metadata:
  name: svc-firefox
  namespace: dev
spec:
  type: LoadBalancer
  ports:
  - name: http-to-firefox
    port: 80
    targetPort: 3000
  selector:
    app: rs-firefox

---

apiVersion: v1
kind: Service
metadata:
  name: svc-nginx
  namespace: dev
spec:
  type: ClusterIP
  ports:
  - name: firefox-to-nginx
    port: 80
    targetPort: 80
  selector:
    app: dep-nginx