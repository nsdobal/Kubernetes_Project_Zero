apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs-app
  namespace: dev
  labels:
    app: app-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-nginx
  template:
    metadata:
      name: nginx
      namespace: dev
      labels:
        app: app-nginx
    spec:
      volumes:
      - name: app-nginx-volume
        persistentVolumeClaim:
          claimName: pvc-az
      containers:
      - name: app-nginx
        image: nginx
        volumeMounts:
        - name: app-nginx-volume
          mountPath : /app-nd


      

